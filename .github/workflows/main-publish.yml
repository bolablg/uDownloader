name: Main — Build & Publish

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'VERSION'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test_build_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest pytest-cov 'ruff>=0.15.0' 'black>=24.8.0'
          pip install -r requirements.txt || true

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests
        run: pytest -q

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync version to README and CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -c "
          import re, os
          ver = os.environ['VERSION']

          # Update README badge
          with open('README.md', 'r') as f:
              content = f.read()
          content = re.sub(r'version-[0-9]+\.[0-9]+\.[0-9]+-', f'version-{ver}-', content)
          with open('README.md', 'w') as f:
              f.write(content)

          # Update CHANGELOG unreleased header
          with open('docs/CHANGELOG.md', 'r') as f:
              content = f.read()
          content = re.sub(
              r'## \[Unreleased\]',
              f'## [{ver}]',
              content,
              count=1,
          )
          with open('docs/CHANGELOG.md', 'w') as f:
              f.write(content)
          "

      - name: Commit version sync and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || {
            git add README.md docs/CHANGELOG.md
            git commit -m "chore: sync version to ${VERSION} [skip ci]"
          }
          git tag -f "${TAG}"
          git push origin HEAD:refs/heads/main
          git push origin "${TAG}" --force

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.version }}"
          generateReleaseNotes: true
